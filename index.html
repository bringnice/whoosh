<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wush аккаунты</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #181c26;
    --surface2: #1e2330;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #3b82f6;
    --accent-dim: rgba(59,130,246,0.15);
    --green: #10b981;
    --green-dim: rgba(16,185,129,0.12);
    --yellow: #f59e0b;
    --yellow-dim: rgba(245,158,11,0.12);
    --danger: #ef4444;
    --danger-dim: rgba(239,68,68,0.12);
    --radius: 10px;
    font-size: 15px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  header {
    max-width: 860px;
    margin: 0 auto 2rem;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: 40px; height: 40px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
  header span { font-size: 0.8rem; color: var(--muted); margin-left: 4px; font-weight: 400; }

  .count-badge {
    margin-left: auto;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--accent);
  }

  .card {
    max-width: 860px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .add-section {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }

  .field label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field input {
    background: var(--surface2);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
    font-family: inherit;
  }

  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--muted); }

  .btn-add {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 18px;
    cursor: pointer;
    white-space: nowrap;
    align-self: flex-end;
    height: 38px;
    transition: opacity 0.15s;
    font-family: inherit;
  }
  .btn-add:hover { opacity: 0.85; }

  .err-msg {
    display: none;
    font-size: 12px;
    color: var(--danger);
    padding: 6px 1.25rem;
    background: rgba(239,68,68,0.07);
    border-bottom: 1px solid rgba(239,68,68,0.15);
  }

  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }

  thead th {
    text-align: left;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: var(--surface2); }

  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }

  .num { color: var(--muted); font-size: 12px; }

  .phone-badge {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    background: var(--accent-dim);
    color: #93c5fd;
    padding: 3px 9px;
    border-radius: 6px;
    display: inline-block;
  }

  .mos-badge {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    background: var(--green-dim);
    color: #6ee7b7;
    padding: 3px 9px;
    border-radius: 6px;
    display: inline-block;
  }

  .countdown {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
  }

  .countdown.ok   { background: var(--green-dim);  color: #6ee7b7; }
  .countdown.warn { background: var(--yellow-dim); color: #fcd34d; }
  .countdown.dead { background: var(--danger-dim); color: #fca5a5; }

  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .ok .dot   { background: var(--green); }
  .warn .dot { background: var(--yellow); }
  .dead .dot { background: var(--danger); }

  .btn-start {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(16,185,129,0.3);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn-start:hover { opacity: 0.75; }

  .waiting { color: var(--muted); font-size: 13px; }

  .btn-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }
  .btn-del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

  .empty {
    padding: 2.5rem 1.25rem;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .empty-icon { font-size: 2rem; margin-bottom: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">🛴</div>
  <div>
    <h1>Wush аккаунты <span>/ Мос.ID</span></h1>
  </div>
  <div class="count-badge" id="badge">0</div>
</header>

<div class="card">
  <div class="add-section">
    <div class="field">
      <label>Wush (телефон)</label>
      <input id="inp-wush" type="text" placeholder="+7 999 000 00 00" />
    </div>
    <div class="field">
      <label>Мос.ID (телефон)</label>
      <input id="inp-mos" type="text" placeholder="+7 999 000 00 01" />
    </div>
    <button class="btn-add" onclick="addRow()">+ Добавить</button>
  </div>
  <div class="err-msg" id="err">Заполни оба поля</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Wush аккаунт</th>
          <th>Мос.ID</th>
          <th>Таймер</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">
      <div class="empty-icon">📋</div>
      Пока нет аккаунтов — добавь первый выше
    </div>
  </div>
</div>

<script>
const DAYS = 10;
let rows = JSON.parse(localStorage.getItem('wush_rows') || '[]');

function save() { localStorage.setItem('wush_rows', JSON.stringify(rows)); }

function daysLeft(ts) {
  const diff = DAYS * 86400000 - (Date.now() - ts);
  return Math.ceil(diff / 86400000);
}

function countdownHtml(i) {
  const r = rows[i];
  if (!r.ts) {
    return `
      <span class="waiting">—</span>
      <button class="btn-start" onclick="startTimer(${i})">▶ Старт</button>
    `;
  }
  const left = daysLeft(r.ts);
  if (left > 3) {
    return `<span class="countdown ok"><span class="dot"></span>${left} дн.</span>`;
  } else if (left > 0) {
    return `<span class="countdown warn"><span class="dot"></span>${left} дн.</span>`;
  } else {
    return `<span class="countdown dead"><span class="dot"></span>Истёк</span>`;
  }
}

function render() {
  const tbody = document.getElementById('rows');
  const empty = document.getElementById('empty');
  document.getElementById('badge').textContent = rows.length;

  if (!rows.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = rows.map((r, i) => `
    <tr>
      <td class="num">${i + 1}</td>
      <td><span class="phone-badge">${r.wush}</span></td>
      <td><span class="mos-badge">${r.mos}</span></td>
      <td style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">${countdownHtml(i)}</td>
      <td><button class="btn-del" onclick="delRow(${i})">×</button></td>
    </tr>
  `).join('');
}

function startTimer(i) {
  rows[i].ts = Date.now();
  save();
  render();
}

function addRow() {
  const w = document.getElementById('inp-wush').value.trim();
  const m = document.getElementById('inp-mos').value.trim();
  const err = document.getElementById('err');
  if (!w || !m) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  rows.push({ wush: w, mos: m, ts: null });
  save();
  document.getElementById('inp-wush').value = '';
  document.getElementById('inp-mos').value = '';
  document.getElementById('inp-wush').focus();
  render();
}

function delRow(i) { rows.splice(i, 1); save(); render(); }

['inp-wush','inp-mos'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    document.getElementById('err').style.display = 'none';
  });
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') addRow();
  });
});

render();
setInterval(render, 60000);
</script>
</body>
</html>
