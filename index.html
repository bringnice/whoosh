<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whoosh аккаунты</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #13161f;
    --surface2: #181c28;
    --surface3: #1e2336;
    --border: rgba(255,255,255,0.06);
    --border-md: rgba(255,255,255,0.1);
    --border-strong: rgba(255,255,255,0.16);
    --text: #dde1ed;
    --text-2: #8b91a8;
    --text-3: #505670;

    --blue: #4f8ef7;
    --blue-dim: rgba(79,142,247,0.12);
    --blue-border: rgba(79,142,247,0.25);

    --green: #3ecf8e;
    --green-dim: rgba(62,207,142,0.1);
    --green-border: rgba(62,207,142,0.2);

    --amber: #f0a429;
    --amber-dim: rgba(240,164,41,0.1);
    --amber-border: rgba(240,164,41,0.2);

    --red: #f05252;
    --red-dim: rgba(240,82,82,0.1);
    --red-border: rgba(240,82,82,0.2);

    --purple: #8b5cf6;
    --purple-dim: rgba(139,92,246,0.1);
    --purple-border: rgba(139,92,246,0.2);

    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 2.5rem 1rem 4rem;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .header {
    max-width: 940px;
    margin: 0 auto 2.5rem;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #1a2040 0%, #1e2a52 100%);
    border: 1px solid var(--blue-border);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.2;
  }

  .header-text p {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge {
    background: var(--blue-dim);
    color: var(--blue);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--blue-border);
    letter-spacing: 0.02em;
  }

  /* ── Card ── */
  .card {
    max-width: 940px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border-md);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  /* ── Add form ── */
  .add-bar {
    padding: 1.1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: flex-end;
    background: var(--surface2);
  }

  .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 130px; }
  .field-xs { flex: 0 0 88px; min-width: 70px; }

  .field label {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .field input {
    background: var(--surface3);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13.5px;
    padding: 8px 11px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }

  .field input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
  }
  .field input::placeholder { color: var(--text-3); }

  .btn-add {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    padding: 0 18px;
    cursor: pointer;
    white-space: nowrap;
    align-self: flex-end;
    height: 36px;
    transition: filter 0.15s;
    font-family: inherit;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-add:hover { filter: brightness(1.12); }
  .btn-add i { font-size: 16px; }

  .err-msg {
    display: none;
    font-size: 12px;
    color: var(--red);
    padding: 6px 1.25rem;
    background: var(--red-dim);
    border-bottom: 1px solid var(--red-border);
    align-items: center;
    gap: 6px;
  }
  .err-msg i { font-size: 14px; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

  thead th {
    text-align: left;
    color: var(--text-3);
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    white-space: nowrap;
  }

  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: rgba(255,255,255,0.025); }

  tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }

  .num {
    color: var(--text-3);
    font-size: 11px;
    font-weight: 500;
    width: 32px;
  }

  /* ── Badges ── */
  .chip {
    font-family: 'SF Mono', ui-monospace, monospace;
    font-size: 12.5px;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    display: inline-block;
    cursor: pointer;
    transition: filter 0.15s;
    border: 1px solid transparent;
  }
  .chip:hover { filter: brightness(1.15); }
  .chip-blue   { background: var(--blue-dim);   color: #7fb3fa; border-color: var(--blue-border); }
  .chip-green  { background: var(--green-dim);  color: #5edca9; border-color: var(--green-border); }
  .chip-amber  { background: var(--amber-dim);  color: #f5bc5c; border-color: var(--amber-border); }
  .chip-purple { background: var(--purple-dim); color: #a78bfa; border-color: var(--purple-border); }

  .editable-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .edit-icon {
    color: var(--text-3);
    font-size: 13px;
    opacity: 0;
    cursor: pointer;
    transition: opacity 0.15s, color 0.15s;
  }
  .editable-wrap:hover .edit-icon { opacity: 1; }
  .edit-icon:hover { color: var(--blue); }

  .inline-input {
    font-family: 'SF Mono', ui-monospace, monospace;
    font-size: 12.5px;
    background: var(--surface3);
    border: 1px solid var(--blue);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 4px 10px;
    outline: none;
    box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
    width: 160px;
  }
  .inline-input-sm { width: 72px; }

  /* ── Timer ── */
  .timer-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .countdown {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 11px;
    border-radius: 20px;
    border: 1px solid transparent;
  }
  .countdown.ok   { background: var(--green-dim);  color: #5edca9; border-color: var(--green-border); }
  .countdown.warn { background: var(--amber-dim);  color: #f5bc5c; border-color: var(--amber-border); }
  .countdown.dead { background: var(--red-dim);    color: #f87171; border-color: var(--red-border); }

  .pips { display: flex; gap: 3px; }
  .pip { width: 5px; height: 5px; border-radius: 50%; }
  .ok .pip   { background: var(--green); }
  .warn .pip { background: var(--amber); }
  .dead .pip { background: var(--red); }

  .btn-start {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid var(--green-border);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: filter 0.15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-start:hover { filter: brightness(1.15); }
  .btn-start i { font-size: 13px; }

  .btn-reset {
    background: none;
    color: var(--text-3);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 500;
    padding: 3px 10px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-reset:hover { color: var(--amber); border-color: var(--amber-border); }
  .btn-reset i { font-size: 13px; }

  .waiting { color: var(--text-3); font-size: 13px; }

  .btn-del {
    background: none;
    border: 1px solid transparent;
    color: var(--text-3);
    cursor: pointer;
    font-size: 14px;
    padding: 5px 7px;
    border-radius: var(--radius-sm);
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    display: flex; align-items: center;
  }
  .btn-del:hover { color: var(--red); background: var(--red-dim); border-color: var(--red-border); }

  /* ── Empty ── */
  .empty {
    padding: 4rem 1.25rem;
    text-align: center;
    color: var(--text-3);
  }
  .empty i { font-size: 2.5rem; margin-bottom: 12px; display: block; }
  .empty-title { font-size: 14px; font-weight: 500; color: var(--text-2); margin-bottom: 4px; }
  .empty-sub { font-size: 13px; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">🛴</div>
  <div class="header-text">
    <h1>Whoosh аккаунты</h1>
    <p>Мос.ID · управление аккаунтами</p>
  </div>
  <div class="header-right">
    <div class="badge" id="badge">0 аккаунтов</div>
  </div>
</header>

<div class="card">
  <div class="add-bar">
    <div class="field">
      <label>Whoosh (телефон)</label>
      <input id="inp-wush" type="text" placeholder="+7 999 000 00 00" />
    </div>
    <div class="field">
      <label>Мос.ID (телефон)</label>
      <input id="inp-mos" type="text" placeholder="+7 999 000 00 01" />
    </div>
    <div class="field field-xs">
      <label>Дней</label>
      <input id="inp-days" type="number" placeholder="10" min="1" max="365" />
    </div>
    <button class="btn-add" onclick="addRow()">
      <i class="ti ti-plus" aria-hidden="true"></i> Добавить
    </button>
  </div>
  <div class="err-msg" id="err">
    <i class="ti ti-alert-circle" aria-hidden="true"></i>
    Заполни поля Whoosh и Мос.ID
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Whoosh</th>
          <th>Мос.ID</th>
          <th>Дней</th>
          <th>Таймер</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">
      <i class="ti ti-clipboard-list" aria-hidden="true"></i>
      <div class="empty-title">Нет аккаунтов</div>
      <div class="empty-sub">Добавь первый аккаунт через форму выше</div>
    </div>
  </div>
</div>

<script>
let rows = JSON.parse(localStorage.getItem('wush_rows') || '[]');
rows = rows.map(r => ({ days: 10, ...r }));
let editingCell = null;

function save() { localStorage.setItem('wush_rows', JSON.stringify(rows)); }

function daysLeft(r) {
  const diff = (r.days || 10) * 86400000 - (Date.now() - r.ts);
  return Math.ceil(diff / 86400000);
}

function countdownHtml(i) {
  const r = rows[i];
  if (!r.ts) return `
    <span class="waiting">—</span>
    <button class="btn-start" onclick="startTimer(${i})">
      <i class="ti ti-player-play" aria-hidden="true"></i> Старт
    </button>`;
  const left = daysLeft(r);
  const warn = Math.max(1, Math.ceil((r.days || 10) * 0.3));
  const cls = left > warn ? 'ok' : left > 0 ? 'warn' : 'dead';
  const label = left > 0 ? `${left} дн.` : 'Истёк';
  return `
    <span class="countdown ${cls}">
      <span class="pips"><span class="pip"></span></span>
      ${label}
    </span>
    <button class="btn-reset" onclick="resetTimer(${i})" title="Сбросить">
      <i class="ti ti-refresh" aria-hidden="true"></i>
    </button>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function editCell(i, field) {
  const r = rows[i];
  const val = field === 'days' ? (r.days || 10) : r[field];
  const isSm = field === 'days';
  return `<input class="inline-input${isSm ? ' inline-input-sm' : ''}"
    id="edit-input" type="${isSm ? 'number' : 'text'}" value="${escHtml(val)}"
    ${isSm ? 'min="1" max="365"' : ''}
    onblur="commit(${i},'${field}',this.value)"
    onkeydown="editKey(event,${i},'${field}')" />`;
}

function editWrap(chipClass, text, i, field) {
  const ed = editingCell && editingCell.i === i && editingCell.field === field;
  if (ed) return editCell(i, field);
  return `<span class="editable-wrap">
    <span class="chip ${chipClass}" onclick="startEdit(${i},'${field}')" title="Изменить">${escHtml(text)}</span>
    <i class="ti ti-pencil edit-icon" onclick="startEdit(${i},'${field}')" aria-label="Изменить"></i>
  </span>`;
}

function render(newEdit) {
  editingCell = newEdit !== undefined ? newEdit : null;
  const tbody = document.getElementById('rows');
  const empty = document.getElementById('empty');
  const n = rows.length;
  document.getElementById('badge').textContent = n === 0 ? '0 аккаунтов' : `${n} аккаунт${n===1?'':'a'}`;
  if (!n) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = rows.map((r, i) => `
    <tr>
      <td class="num">${i + 1}</td>
      <td>${editWrap('chip-blue', r.wush, i, 'wush')}</td>
      <td>${editWrap('chip-green', r.mos, i, 'mos')}</td>
      <td>${editWrap('chip-amber', (r.days || 10) + ' дн.', i, 'days')}</td>
      <td class="timer-cell">${countdownHtml(i)}</td>
      <td><button class="btn-del" onclick="delRow(${i})" title="Удалить">
        <i class="ti ti-trash" aria-hidden="true"></i>
      </button></td>
    </tr>`).join('');
  if (editingCell) {
    const el = document.getElementById('edit-input');
    if (el) { el.focus(); el.select(); }
  }
}

function startEdit(i, field) { render({ i, field }); }

function commit(i, field, val) {
  val = String(val).trim();
  if (val === '') { render(); return; }
  if (field === 'days') {
    const n = parseInt(val);
    if (isNaN(n) || n < 1) { render(); return; }
    rows[i].days = n;
  } else {
    rows[i][field] = val;
  }
  save(); render();
}

function editKey(e, i, field) {
  if (e.key === 'Enter') commit(i, field, e.target.value);
  if (e.key === 'Escape') render();
}

function startTimer(i) { rows[i].ts = Date.now(); save(); render(); }
function resetTimer(i) { rows[i].ts = Date.now(); save(); render(); }

function addRow() {
  const w = document.getElementById('inp-wush').value.trim();
  const m = document.getElementById('inp-mos').value.trim();
  const dv = document.getElementById('inp-days').value.trim();
  const d = dv === '' ? 10 : parseInt(dv);
  const err = document.getElementById('err');
  if (!w || !m) { err.style.display = 'flex'; return; }
  err.style.display = 'none';
  rows.push({ wush: w, mos: m, days: (isNaN(d) || d < 1) ? 10 : d, ts: null });
  save();
  document.getElementById('inp-wush').value = '';
  document.getElementById('inp-mos').value = '';
  document.getElementById('inp-days').value = '';
  document.getElementById('inp-wush').focus();
  render();
}

function delRow(i) { rows.splice(i, 1); save(); render(); }

['inp-wush','inp-mos','inp-days'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    document.getElementById('err').style.display = 'none';
  });
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') addRow();
  });
});

render();
setInterval(() => { if (!editingCell) render(); }, 60000);
</script>
</body>
</html>
